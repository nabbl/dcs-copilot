[project]
name = "dcs-copilot-client"
version = "0.1.0"
description = "Thin read-only desktop client for DCS Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dcs-copilot-shared",
    "pyaudio>=0.2.14,<0.3",
    "pynput>=1.8,<2; sys_platform == 'win32'",
    "websockets>=16,<17",
]

[tool.uv.sources]
dcs-copilot-shared = { workspace = true }

[project.scripts]
dcs-copilot = "dcs_copilot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcs_copilot"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyaudio", "pynput.*"]
ignore_missing_imports = true
