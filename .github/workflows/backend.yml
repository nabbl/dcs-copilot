name: Backend container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cloud/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - "captain-definition"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - "captain-definition"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Test cloud and shared packages
        run: uv run --frozen --package dcs-copilot-cloud pytest -q cloud/tests shared/tests

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-cloud" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate production configuration
        shell: bash
        env:
          CAPROVER_SERVER: ${{ vars.CAPROVER_SERVER }}
          CAPROVER_BACKEND_APP: ${{ vars.CAPROVER_BACKEND_APP }}
          CAPROVER_BACKEND_APP_TOKEN: ${{ secrets.CAPROVER_BACKEND_APP_TOKEN }}
        run: |
          for name in CAPROVER_SERVER CAPROVER_BACKEND_APP CAPROVER_BACKEND_APP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing production setting: $name" >&2
              exit 1
            fi
          done
      - name: Deploy backend to CapRover
        uses: caprover/deploy-from-github@d76580d79952f6841c453bb3ed37ef452b19752c
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_BACKEND_APP }}
          token: ${{ secrets.CAPROVER_BACKEND_APP_TOKEN }}
          image: ${{ needs.publish.outputs.backend-image }}:${{ github.sha }}
