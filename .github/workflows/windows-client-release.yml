name: Windows client release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        default: "0.1.0"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Test
        run: uv run --all-packages pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          ./packaging/windows/build.ps1 `
            -Version $version `
            -ServiceUrl "${{ vars.DCS_COPILOT_SERVICE_URL || 'ws://127.0.0.1:47100/v2/realtime' }}"
      - name: Smoke test packaged backend
        shell: pwsh
        run: |
          $backend = Resolve-Path "dist/windows/MaraBackend/MaraBackend.exe"
          $env:MARA_DATA_DIR = Join-Path $env:RUNNER_TEMP "mara-smoke"
          $env:MARA_PROVISION_MODELS = "0"
          $process = Start-Process $backend -ArgumentList "serve --host 127.0.0.1 --port 47100" -PassThru
          try {
            $ready = $false
            1..60 | ForEach-Object {
              if (-not $ready) {
                try {
                  $response = Invoke-RestMethod "http://127.0.0.1:47100/ready" -TimeoutSec 1
                  $ready = $response.status -eq "ready"
                } catch { Start-Sleep -Milliseconds 500 }
              }
            }
            if (-not $ready) { throw "Packaged backend did not become ready." }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
      - name: Upload installer to development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "windows-dev-$version" }
          $artifacts = Get-ChildItem "dist/windows/MARA-Setup-*.exe", "dist/windows/MARA-Backend-*-windows-x64.zip", "dist/windows/checksums.txt"
          $installer = $artifacts | Where-Object Name -Like "MARA-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not produced."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target $env:GITHUB_SHA `
              --title "MARA Windows bundle $version" `
              --notes "Unsigned Windows development installer built from $env:GITHUB_SHA." `
              --latest=false
          }
          gh release upload $tag $artifacts.FullName --clobber
