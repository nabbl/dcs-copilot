[project]
name = "dcs-copilot-cloud"
version = "0.1.0"
description = "Cloud service boundary for DCS Copilot"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "certifi>=2026.7.22,<2027",
    "dcs-copilot-shared",
    "fastapi>=0.116,<1",
    "keyring>=25.6,<26",
    "pipecat-ai[kokoro,openai]>=1.7,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
    "websockets>=16,<17",
]

[project.scripts]
dcs-copilot-cloud = "dcs_copilot_cloud.main:main"
mara-coach = "dcs_copilot_cloud.coach.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.7,<3",
    "pytest>=8.3,<9",
]

[tool.uv.sources]
dcs-copilot-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcs_copilot_cloud"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
