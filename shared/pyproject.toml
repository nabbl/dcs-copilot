[project]
name = "dcs-copilot-shared"
version = "0.1.0"
description = "Versioned protocol schemas shared by DCS Copilot components"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcs_copilot_protocol"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
