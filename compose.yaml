name: dcs-copilot

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dcs_copilot
      POSTGRES_USER: dcs_copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  backend:
    init: true
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CLOUD_HOST: 0.0.0.0
      CLOUD_PORT: 8000
      CLOUD_LOG_LEVEL: ${CLOUD_LOG_LEVEL:-info}
      CLOUD_HANDSHAKE_TIMEOUT_SECONDS: ${CLOUD_HANDSHAKE_TIMEOUT_SECONDS:-5}
      CLOUD_MAX_UTTERANCE_SECONDS: ${CLOUD_MAX_UTTERANCE_SECONDS:-60}
      CLOUD_AIRCRAFT_TOOL_TIMEOUT_SECONDS: ${CLOUD_AIRCRAFT_TOOL_TIMEOUT_SECONDS:-3}
      DCS_COPILOT_DEV_TOKEN: ""
      DCS_COPILOT_DATABASE_URL: postgresql+asyncpg://dcs_copilot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/dcs_copilot
      DCS_COPILOT_AUTH_SIGNING_KEY: ${DCS_COPILOT_AUTH_SIGNING_KEY:?Set DCS_COPILOT_AUTH_SIGNING_KEY in .env}
      AUTH_ACCESS_TOKEN_SECONDS: ${AUTH_ACCESS_TOKEN_SECONDS:-900}
      AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      STT_MODEL: ${STT_MODEL:-gpt-transcribe}
      STT_LANGUAGE: ${STT_LANGUAGE:-en}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-80}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}
      TTS_VOICE: ${TTS_VOICE:-marin}
    ports:
      - "${DCS_COPILOT_PORT:-8000}:8000"
    networks:
      - backend

  database-backup:
    build:
      context: .
      dockerfile: ops/postgres-backup/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: dcs_copilot
      PGUSER: dcs_copilot
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-90000}
    volumes:
      - postgres-backups:/backups
    networks:
      - backend

volumes:
  postgres-data:
  postgres-backups:

networks:
  backend:
